<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نوبت‌دهی آرایشگاه</title>
  <meta name="theme-color" content="#5b4ff5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b4ff5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='6' cy='6' r='3'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Cpath d='M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // اعمال تم قبل از نمایش صفحه برای جلوگیری از چشمک‌زدن
    (function () {
      var t = null;
      try { t = localStorage.getItem('hd_theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand">
        <span class="brand-icon" data-icon="scissors"></span>
        <span class="brand-name" id="shopName">آرایشگاه</span>
      </a>
      <div class="topbar-actions" id="topActions"></div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading"><span class="spinner"></span></div>
  </main>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
