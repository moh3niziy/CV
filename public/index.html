<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نوبت‌دهی آرایشگاه</title>
  <meta name="theme-color" content="#5b4ff5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b4ff5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='6' cy='6' r='3'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Cpath d='M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // اعمال تم قبل از نمایش صفحه برای جلوگیری از چشمک‌زدن
    (function () {
      var t = null;
      try { t = localStorage.getItem('hd_theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand">
        <span class="brand-icon" data-icon="scissors"></span>
        <span class="brand-name" id="shopName">آرایشگاه</span>
      </a>
      <div class="topbar-actions" id="topActions"></div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading"><span class="spinner"></span></div>
  </main>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script>
    // اگر مرورگری کد سایت را اجرا نکند، به‌جای صفحهٔ سفید پیام خطا نمایش داده می‌شود
    (function () {
      function show(msg) {
        var app = document.getElementById('app');
        if (!app || app.getAttribute('data-crashed') || app.querySelector('.page, .expired-wrap')) return; // صفحه قبلاً درست ساخته شده
        app.setAttribute('data-crashed', '1');
        app.innerHTML = '<div style="max-width:440px;margin:60px auto;padding:20px;border-radius:16px;border:1px solid #e3e3ec;background:#fff;color:#17171f;text-align:center;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl">' +
          '<b style="font-size:17px">صفحه در این مرورگر درست بارگذاری نشد</b>' +
          '<p style="color:#6b6b7b;font-size:13.5px">لطفاً مرورگر را به‌روز کنید یا صفحه را در Chrome باز کنید. اگر مشکل ادامه داشت، از همین پیام عکس بگیرید و برای پشتیبانی بفرستید.</p>' +
          '<pre style="direction:ltr;text-align:left;white-space:pre-wrap;font-size:11px;background:#f0f0f5;padding:10px;border-radius:10px;color:#444">' +
          String(msg).replace(/</g, '&lt;') + '\n\n' + navigator.userAgent.replace(/</g, '&lt;') + '</pre></div>';
      }
      window.addEventListener('error', function (e) { show((e.message || 'Error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
